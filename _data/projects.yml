- name: Bird Audio Detection Kaggle Challenge
  bullets:
    - Use different preprocessing methods and fine-tune a Convolutional Recurrent Neural Network to detect bird sound in audio
    - "Top 5 in private leaderboard, top 11 on public leaderboard, out of over 70 teams"
    - "Tools: Tensorflow, librosa"

- name: "Acoustic Scene Classification with Multiple Devices (DCASE 2020)"
  bullets:
    - "Inspired by top submissions: transform audio to log-mel spectrogram format, compute deltas & delta-deltas features"
    - Implement a ResNet fusion model learning features from different frequency-bin segments and merging them to predict the target class
    - "Without data augmentation, the model achieves ~77% accuracy on the development test dataset (top 5)"

- name: AI-Based Demand Forecasting for Porsche AG
  sub: Business Intelligence Capstone Project
  bullets:
    - Develop model pipeline — data preprocessing, training, and testing
    - Data analysis
    - "Build time series models: ARIMAX, XGBoost, Prophet, and a metamodel of all three"
