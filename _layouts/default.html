<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ site.title }}{% if page.title %} · {{ page.title }}{% endif %}</title>
  <meta name="description" content="{{ site.description }}">
  <meta name="author" content="{{ site.author }}">

  <!-- Open Graph / social -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ site.title }}">
  <meta property="og:description" content="{{ site.description }}">
  <meta property="og:url" content="{{ site.url }}">
  <meta name="twitter:card" content="summary">

  <!-- Favicon: "DV" monogram -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%239c3d17'/%3E%3Ctext x='16' y='22' font-family='Georgia,serif' font-size='15' font-weight='600' text-anchor='middle' fill='white'%3EDV%3C/text%3E%3C/svg%3E">

  <!-- Set theme before paint to avoid flash of wrong theme -->
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('theme');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var theme = stored || (prefersDark ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {}
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;1,8..60,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">

  {% if site.google_analytics %}
  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics }}"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', '{{ site.google_analytics }}');
  </script>
  {% endif %}
</head>
<body>
  <header class="nav" id="top">
    <div class="nav__inner">
      <a class="nav__brand" href="{{ '/' | relative_url }}">{{ site.author }}</a>
      <nav class="nav__links" aria-label="Sections">
        <a href="#experience">Experience</a>
        <a href="#publications">Publications</a>
        <a href="#projects">Projects</a>
        <a href="#education">Education</a>
        <a href="#skills">Skills</a>
      </nav>
      <button id="theme-toggle" class="theme-toggle" type="button">Dark</button>
    </div>
  </header>

  <main class="container">
    {{ content }}
  </main>

  <footer class="footer">
    <div class="container footer__inner">
      <span class="footer__links">{% for s in site.data.social %}<a href="{{ s.url }}" rel="noopener">{{ s.name }}</a>{% endfor %}</span>
      <span>Last updated {{ site.time | date: "%B %Y" }}</span>
    </div>
  </footer>

  <script src="{{ '/assets/js/theme.js' | relative_url }}" defer></script>
</body>
</html>
